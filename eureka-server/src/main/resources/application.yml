# ==============================================================================
# Eureka Server - Servidor de Descoberta e Registro (Netflix Eureka)
# ==============================================================================
# As configuracoes completas deste servico (porta 8761, dashboard habilitado,
# desativacao de replicacao de peers / eureka client) sao obtidas diretamente
# do Config Server. O Config Server deve ser iniciado previamente.
# ==============================================================================
spring:
  application:
    name: eureka-server
  config:
    # Importa configuracoes do Spring Cloud Config Server na porta padrao 8888
    import: "optional:configserver:http://localhost:8888"

