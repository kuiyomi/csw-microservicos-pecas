# ==============================================================================
# Configuracao Centralizada: Eureka Server (Service Registry & Discovery)
# ==============================================================================
server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # Servidor standalone: o Eureka Server e o proprio registro, sem replicacao de peers
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Desativa auto-preservacao para ambiente de desenvolvimento
    enable-self-preservation: false
  dashboard:
    # Dashboard web do Eureka ativado em http://localhost:8761/
    enabled: true

# Endpoints de monitoramento e integridade
management:
  endpoints:
    web:
      exposure:
        include: health, info
