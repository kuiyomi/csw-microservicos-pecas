# ==============================================================================
# Configuracao Centralizada: Clientes Service (Gestao de Clientes)
# ==============================================================================
server:
  port: 8082

spring:
  application:
    name: clientes-service
  datasource:
    # Banco de dados em memoria H2
    url: jdbc:h2:mem:clientesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # Console web do H2 em /h2-console
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Conexao com o Eureka Server
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Endpoints de monitoramento e integridade
management:
  endpoints:
    web:
      exposure:
        include: health, info
