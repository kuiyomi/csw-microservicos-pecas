server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # Utiliza perfil 'native' para ler arquivos de configuracao do diretorio local/classpath
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./config-repo
            - file:../config-repo
            - classpath:/config-repo

# Configuracao para registro opcional no Eureka
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Exposicao dos endpoints de monitoramento
management:
  endpoints:
    web:
      exposure:
        include: health, info
